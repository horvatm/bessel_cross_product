name: Build and numerical checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: C++ numerical tests
        run: ctest --test-dir build --output-on-failure
      - name: Install reference calculation dependency
        run: python -m pip install 'mpmath>=1.3,<2'
      - name: Independent high-precision reference checks
        run: python tests/validate_mpmath.py
